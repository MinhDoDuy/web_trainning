<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <h3 class="text-center mb-4 text-dark fw-bold">Reset Password</h3>

                <form method="POST" action="{{ url_for('reset_password_route', username=username) }}"
                      class="auth-form reset-password-form">
                    <!-- New Password -->
                    <div class="mb-3 position-relative input-group">
                        <input type="password" name="password" class="form-control" placeholder="New Password"
                               id="resetPasswordInput">
                        <i class="bi bi-eye eye-toggle reset-eye-toggle"
                           onclick="togglePassword('resetPasswordInput', this)"></i>
                        <span class="clear-input reset-clear-input" onclick="clearInput(this)">×</span>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3 position-relative input-group">
                        <input type="password" name="confirm_password" class="form-control"
                               placeholder="Confirm Password" id="resetConfirmPasswordInput">
                        <i class="bi bi-eye eye-toggle reset-eye-toggle"
                           onclick="togglePassword('resetConfirmPasswordInput', this)"></i>
                        <span class="clear-input reset-clear-input" onclick="clearInput(this)">×</span>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 mb-2">Reset Password</button>
                </form>

                <div class="text-center mt-2">
                    <a href="{{ url_for('login_route') }}" class="btn btn-secondary btn-sm ms-2 link-hover"> <i
                            class="bi bi-box-arrow-in-right"></i>Back to Login</a>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Toasts -->
<div class="toast-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="toast align-items-center text-bg-{{ category }} border-0 mb-2" role="alert">
        <div class="d-flex">
            <div class="toast-body">{{ message }}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function clearInput(el) {
        const input = el.previousElementSibling;
        input.value = "";
        input.focus();
    }

    function togglePassword(inputId, icon) {
        const pwd = document.getElementById(inputId);
        if (pwd.type === "password") {
            pwd.type = "text";
            icon.classList.replace("bi-eye", "bi-eye-slash");
        } else {
            pwd.type = "password";
            icon.classList.replace("bi-eye-slash", "bi-eye");
        }
    }

    document.querySelectorAll('.toast').forEach(t => {
        new bootstrap.Toast(t, {delay: 3000}).show();
    });
</script>

</body>
</html>
