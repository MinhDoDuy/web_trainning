<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <h3 class="text-center mb-4 text-dark fw-bold">Forgot Password</h3>

                <form method="POST" action="{{ url_for('forgot_password_route') }}"
                      class="auth-form forgot-password-form">
                    <div class="mb-3 position-relative input-group">
                        <input type="text" name="username" class="form-control"
                               placeholder="Enter your username" value="{{ request.form.username or '' }}">
                        <span class="clear-input forgot-clear-input" onclick="clearInput(this)">×</span>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 mb-2">Submit</button>
                </form>
                <div class="text-center mt-2">
                    <a href="{{ url_for('login_route') }}" class="btn btn-secondary btn-sm ms-2 link-hover">
                        <i class="bi bi-box-arrow-in-right"></i>Back to Login</a>
                </div>


            </div>
        </div>
    </div>
</div>

<!-- Toasts -->
<div class="toast-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="toast align-items-center text-bg-{{ category }} border-0 mb-2" role="alert">
        <div class="d-flex">
            <div class="toast-body">{{ message }}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function clearInput(el) {
        const input = el.previousElementSibling;
        input.value = "";
        input.focus();
    }

    document.querySelectorAll('.toast').forEach(t => {
        new bootstrap.Toast(t, {delay: 3000}).show();
    });
</script>

</body>
</html>
