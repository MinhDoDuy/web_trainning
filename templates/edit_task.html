<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sửa Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2>Sửa Task</h2>

    <form action="{{ url_for('edit_task_route', task_id=task.id) }}" method="post" class="mt-4">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" value="{{ task.title }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" name="description" value="{{ task.description }}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="completed" {% if task.status=='completed' %}selected{% endif %}>Completed</option>
                <option value="pending" {% if task.status=='pending' %}selected{% endif %}>Pending</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Cập nhật</button>
        <a href="{{ url_for('index_route') }}" class="btn btn-secondary">Hủy</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
