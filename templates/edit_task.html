<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sửa Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4">Sửa Task</h1>
    <form action="" method="post" class="row g-3">
        <div class="col-md-6">
            <input type="text" name="title" value="{{ task.title }}" class="form-control" required>
        </div>
        <div class="col-md-4">
            <input type="text" name="description" value="{{ task.description }}" class="form-control">
        </div>
        <div class="col-md-2">
            <select name="status" class="form-select">
                <option value="completed" {% if task.status=='completed' %}selected{% endif %}>Completed</option>
                <option value="pending" {% if task.status=='pending' %}selected{% endif %}>Pending</option>
            </select>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Cập nhật Task</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Quay về danh sách</a>
        </div>
    </form>
</div>
</body>
</html>
