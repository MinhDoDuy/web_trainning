<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .login-card {
            width: 380px;
            border-radius: 20px;
        }

        .icon-input {
            position: absolute;
            top: 50%;
            left: 12px;
            transform: translateY(-50%);
            font-size: 18px;
            color: #6c757d;
        }

        .input-with-icon input {
            padding-left: 40px;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">


<!-- ================= TOAST FLASH (GÓC PHẢI) ================== -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="toast text-bg-{{ category }} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">{{ message }}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}
</div>


<!-- ================== LOGIN CARD =================== -->
<div class="card shadow-lg p-4 login-card">

    <h3 class="text-center mb-4 fw-bold">Đăng nhập</h3>

    <form method="post">

        <!-- USERNAME -->
        <div class="mb-3 position-relative input-with-icon">
            <i class="bi bi-person icon-input"></i>
            <input name="username" class="form-control" required placeholder="Username">
        </div>

        <!-- PASSWORD -->
        <div class="mb-3 position-relative input-with-icon">
            <i class="bi bi-lock icon-input"></i>
            <input name="password" type="password" class="form-control" required placeholder="Password">
        </div>

        <!-- LOGIN BUTTON -->
        <button class="btn btn-dark w-100 mt-2">Đăng</button>
    </form>

    <!-- REGISTER BUTTON -->
    <div class="text-center mt-3">
        <p>Bạn chưa có tài khoản ?</p>
        <a href="{{ url_for('register') }}" class="text-decoration-none">
            <button class="btn btn-outline-secondary w-100">
                <i class="bi bi-person-plus me-1"></i> Đăng
            </button>
        </a>
    </div>

</div>


<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Auto toast
    var toastElList = [].slice.call(document.querySelectorAll('.toast'));
    toastElList.forEach((toastEl) => {
        new bootstrap.Toast(toastEl, { delay: 3000 }).show();
    });
</script>

</body>
</html>
