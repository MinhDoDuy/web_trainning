<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <h3 class="text-center mb-4 text-dark fw-bold">Login</h3>

                <form method="POST" action="{{ url_for('login_route') }} " >
                    <!-- Username -->
                    <div class="mb-3 position-relative input-group">
                        <input type="text" name="username" class="form-control"
                               placeholder="Username"
                               value="{{ username_value or '' }}">
                        <span class="clear-input" onclick="clearInput(this)"><i class="bi bi-x-circle-fill"></i></span>
                    </div>


                    <!-- Password -->
                    <div class="mb-3 position-relative input-group">
                        <input type="password" name="password" class="form-control"
                               placeholder="Password" id="passwordInput">
                        <i class="bi bi-eye eye-toggle" onclick="togglePassword()"></i>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100">Login</button>
                </form>

                <div class="text-center mt-3">
                    <a href="{{ url_for('forgot_password_route') }}" class="btn btn-secondary btn-sm ms-2 link-hover">
                        <i class="bi bi-key"></i> Forgot password?
                    </a>
                    <a href="{{ url_for('register_route') }}" class="btn btn-secondary btn-sm ms-1 link-hover">
                        <i class="bi bi-person-plus"></i> Register
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Toasts -->
<div class="toast-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="toast align-items-center text-bg-{{ category }} border-0 mb-2" role="alert">
        <div class="d-flex">
            <div class="toast-body">{{ message }}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function togglePassword() {
        const pwd = document.getElementById('passwordInput');
        const icon = pwd.nextElementSibling;

        if (pwd.type === "password") {
            pwd.type = "text";
            icon.classList.replace("bi-eye", "bi-eye-slash");
        } else {
            pwd.type = "password";
            icon.classList.replace("bi-eye-slash", "bi-eye");
        }
    }

    function clearInput(el) {
        const input = el.previousElementSibling;
        input.value = "";
        input.focus();
    }


    document.querySelectorAll('.toast').forEach(t => {
        new bootstrap.Toast(t, {delay: 3000}).show();
    });
</script>

</body>
</html>
