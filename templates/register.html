<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Register</h3>
                    <form method="POST" action="{{ url_for('register_route') }}">
                        <div class="mb-3">
                            <input type="text" name="username" class="form-control" placeholder="Username"
                                   value="{{ username_value or '' }}">
                        </div>
                        <div class="mb-3">
                            <input type="password" name="password" class="form-control" placeholder="Password">
                        </div>
<!--                        <div class="mb-3">-->
<!--                            <select name="role" class="form-select">-->
<!--                                <option value="user" {% if role_value=='user' %}selected{% endif %}>User</option>-->
<!--                                <option value="admin" {% if role_value=='admin' %}selected{% endif %}>Admin</option>-->
<!--                            </select>-->
<!--                        </div>-->
                        <button type="submit" class="btn btn-secondary w-100">Register</button>
                    </form>
                    <div class="text-center mt-3">
                        Already have an Account?
                        <a href="{{ url_for('login_route') }}" class="btn btn-dark btn-sm ms-2">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast thông báo -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
        <div class="toast align-items-center text-bg-{{ category }} border-0 mb-2" role="alert" aria-live="assertive"
             aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">{{ message }}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
        {% endfor %}
    {% endif %}
    {% endwith %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.toast').forEach(toastEl => {
        new bootstrap.Toast(toastEl, {delay: 3000}).show();
    });
</script>

</body>
</html>
