<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f3f4f6; }
        .register-card { max-width: 420px; margin: auto; margin-top: 100px; }
    </style>
</head>
<body>
<div class="register-card card shadow">
    <div class="card-body p-4">
        <h3 class="text-center mb-4">Đăng ký</h3>

        <!-- Flash messages -->
        <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="toast text-bg-{{ category }} border-0 mb-2">
                    <div class="d-flex">
                        <div class="toast-body">{{ message }}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}
        </div>

        <form method="POST" action="{{ url_for('register_route') }}">
            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" placeholder="Nhập username..." required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="Nhập password..." required>
            </div>
            <div class="mb-3">
                <label class="form-label">Role</label>
                <select name="role" class="form-select">
                    <option value="user" selected>User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100">Đăng ký</button>
        </form>

        <div class="text-center mt-3">
            Đã có tài khoản?
            <a href="{{ url_for('login_route') }}">Đăng nhập</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.toast').forEach(toastEl => {
        new bootstrap.Toast(toastEl, {delay: 3000}).show();
    });
</script>
</body>
</html>
